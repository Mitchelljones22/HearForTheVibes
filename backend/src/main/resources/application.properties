spring.application.name=backend

spring.datasource.url=jdbc:sqlite:./data/hearforthevibes.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Login session cookie (JSESSIONID). HttpOnly stops JavaScript from reading it;
# SameSite=Lax stops other websites from sending it along with requests they trigger.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
