spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hearforthevibes}
spring.datasource.username=${DATABASE_USERNAME:hearforthevibes}
spring.datasource.password=${DATABASE_PASSWORD:hearforthevibes}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Login session cookie (JSESSIONID). HttpOnly stops JavaScript from reading it;
# SameSite=Lax stops other websites from sending it along with requests they trigger.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
