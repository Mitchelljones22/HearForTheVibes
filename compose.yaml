services:
  frontend:
    image: node:24-bookworm
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8080
      DEV_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_dependencies:/app/node_modules
      - npm_cache:/root/.npm
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

  backend:
    image: eclipse-temurin:25-jdk
    working_dir: /app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      TEST_DATABASE_URL: jdbc:postgresql://database-test:5432/${TEST_DATABASE_NAME:?Set TEST_DATABASE_NAME in .env}
      TEST_DATABASE_USERNAME: ${TEST_DATABASE_USERNAME:?Set TEST_DATABASE_USERNAME in .env}
      TEST_DATABASE_PASSWORD: ${TEST_DATABASE_PASSWORD:?Set TEST_DATABASE_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
      database-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_build:/app/target
      - maven_cache:/root/.m2
    command: ["sh", "./mvnw", "spring-boot:run"]

  database:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  database-test:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${TEST_DATABASE_NAME:?Set TEST_DATABASE_NAME in .env}
      POSTGRES_USER: ${TEST_DATABASE_USERNAME:?Set TEST_DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:?Set TEST_DATABASE_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  frontend_dependencies:
  npm_cache:
  backend_build:
  maven_cache:
  postgres_data:
  database:
